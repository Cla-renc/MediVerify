name: MediVerify CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests (Python 3.11, Django 5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linting (flake8)
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=migrations,venv --statistics || true

      - name: Run backend tests with coverage
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-mediverify
          HMAC_SECRET_KEY: ci-test-hmac-key
          DEBUG: "True"
        run: |
          pip install pytest-cov
          pytest tests/ -v --tb=short --cov=apps --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: backend/coverage.xml
          flags: backend

  frontend-tests:
    name: Frontend Tests (Node 20, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker-compose build

      - name: Verify containers start
        run: |
          docker-compose up -d db
          sleep 5
          docker-compose up -d backend
          sleep 10
          curl --fail http://localhost:8000/api/v1/verify/ -X POST -H "Content-Type: application/json" -d '{"code":"test"}' || echo "Backend responded (expected 200 for INVALID code)"
          docker-compose down
